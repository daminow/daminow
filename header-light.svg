<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Timur Daminov, Technical Product Manager">
  <title>Timur Daminov, Technical Product Manager</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbf8ff"/>
      <stop offset="100%" stop-color="#f1e9ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="role" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <style>
      .name { animation: rise 0.9s ease-out 0.15s both; }
      .rule { animation: draw 1.1s ease-out 0.45s both; stroke-dasharray: 132; }
      .role { animation: rise 0.9s ease-out 0.5s both; }
      .tag  { animation: rise 0.9s ease-out 0.75s both; }
      .pills { animation: rise 0.9s ease-out 0.95s both; }
      .b0 { animation: drift0 14s ease-in-out infinite; }
      .b1 { animation: drift1 18s ease-in-out infinite; }
      .b2 { animation: drift2 16s ease-in-out infinite; }
      .dot { animation: twinkle 5s ease-in-out infinite; }
      .dot:nth-of-type(2) { animation-delay: 1.1s; }
      .dot:nth-of-type(3) { animation-delay: 2.2s; }
      .dot:nth-of-type(4) { animation-delay: 3.3s; }
      .bar { animation: breathe 6s ease-in-out infinite; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes draw {
        from { stroke-dashoffset: 132; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes drift0 {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(26px, -14px); }
      }
      @keyframes drift1 {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(-22px, 12px); }
      }
      @keyframes drift2 {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(14px, 16px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.20; }
        50%      { opacity: 0.75; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.60; }
        50%      { opacity: 0.30; }
      }

      @media (prefers-reduced-motion: reduce) {
        .name, .rule, .role, .tag, .pills, .b0, .b1, .b2, .dot, .bar {
          animation: none;
          opacity: 1;
        }
        .rule { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="900" height="240" rx="10" fill="url(#bg)"/>

  <g opacity="0.055" stroke="#7f40ff" stroke-width="0.6">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
  </g>

  <g filter="url(#soft)">
    <circle class="b0" cx="150" cy="70" r="120" fill="#7f40ff" opacity="0.10"/>
    <circle class="b1" cx="760" cy="180" r="110" fill="#fb8dff" opacity="0.08"/>
    <circle class="b2" cx="470" cy="30" r="100" fill="#c2a4ff" opacity="0.07"/>
  </g>

  <g fill="#7f40ff" opacity="0.28">
    <circle class="dot" cx="118" cy="196" r="2"/>
    <circle class="dot" cx="792" cy="58" r="2.5"/>
    <circle class="dot" cx="712" cy="204" r="1.8"/>
    <circle class="dot" cx="196" cy="52" r="1.8"/>
  </g>

  <text class="name" x="450" y="74" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="3" fill="#17141f">TIMUR DAMINOV</text>

  <line class="rule" x1="384" y1="94" x2="516" y2="94" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round"/>

  <text class="role" x="450" y="126" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4.5" fill="url(#role)">TECHNICAL PRODUCT MANAGER</text>

  <text class="tag" x="450" y="158" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="2" fill="#5a5468">B2B  /  B2C  /  B2B2C  /  AI  /  API</text>

  <g class="pills">
    <rect x="356" y="172" width="78" height="24" rx="12" fill="#7f40ff" fill-opacity="0.10" stroke="#7f40ff" stroke-opacity="0.28"/>
    <text x="395" y="188" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#5b21b6">4 YEARS</text>

    <rect x="446" y="172" width="98" height="24" rx="12" fill="#7f40ff" fill-opacity="0.10" stroke="#7f40ff" stroke-opacity="0.28"/>
    <text x="495" y="188" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" fill="#5b21b6">3 PRODUCTS</text>
  </g>

  <rect class="bar" x="0" y="237" width="900" height="3" fill="url(#rule)" opacity="0.60"/>

  <rect x="0.5" y="0.5" width="899" height="239" rx="10" fill="none" stroke="#7f40ff" stroke-opacity="0.20"/>
</svg>
