<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Timur Daminov, Technical Product Manager">
  <title>Timur Daminov, Technical Product Manager</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fbf8ff"/>
      <stop offset="100%" stop-color="#f1e9ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- a <line> has a zero-height bounding box, so objectBoundingBox units would not paint -->
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="395" y1="0" x2="505" y2="0">
      <stop offset="0%" stop-color="#7f40ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="role" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a21caf"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <style>
      .name   { animation: rise 0.9s ease-out 0.15s both; }
      .role   { animation: rise 0.9s ease-out 0.40s both; }
      .models { animation: rise 0.9s ease-out 0.60s both; }
      .rule   { animation: draw 1.1s ease-out 0.80s both; stroke-dasharray: 110; }
      .proof  { animation: rise 0.9s ease-out 1.00s both; }
      .b0 { animation: drift0 14s ease-in-out infinite; }
      .b1 { animation: drift1 18s ease-in-out infinite; }
      .b2 { animation: drift2 16s ease-in-out infinite; }
      .dot { animation: twinkle 5s ease-in-out infinite; }
      .dot:nth-of-type(2) { animation-delay: 1.1s; }
      .dot:nth-of-type(3) { animation-delay: 2.2s; }
      .dot:nth-of-type(4) { animation-delay: 3.3s; }
      .bar { animation: breathe 6s ease-in-out infinite; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes draw {
        from { stroke-dashoffset: 110; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes drift0 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(26px, -14px); } }
      @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-22px, 12px); } }
      @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(14px, 16px); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.20; } 50% { opacity: 0.75; } }
      @keyframes breathe { 0%, 100% { opacity: 0.60; } 50% { opacity: 0.30; } }

      @media (prefers-reduced-motion: reduce) {
        .name, .role, .models, .rule, .proof, .b0, .b1, .b2, .dot, .bar {
          animation: none;
          opacity: 1;
        }
        .rule { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="900" height="240" rx="10" fill="url(#bg)"/>

  <g opacity="0.055" stroke="#7f40ff" stroke-width="0.6">
    <line x1="0" y1="48" x2="900" y2="48"/>
    <line x1="0" y1="96" x2="900" y2="96"/>
    <line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
  </g>

  <g filter="url(#soft)">
    <circle class="b0" cx="150" cy="70" r="120" fill="#7f40ff" opacity="0.10"/>
    <circle class="b1" cx="760" cy="180" r="110" fill="#fb8dff" opacity="0.08"/>
    <circle class="b2" cx="470" cy="30" r="100" fill="#c2a4ff" opacity="0.07"/>
  </g>

  <g fill="#7f40ff" opacity="0.28">
    <circle class="dot" cx="72" cy="206" r="2"/>
    <circle class="dot" cx="836" cy="42" r="2.5"/>
    <circle class="dot" cx="806" cy="214" r="1.8"/>
    <circle class="dot" cx="84" cy="44" r="1.8"/>
  </g>

  <text class="name" x="450" y="57" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#17141f">TIMUR DAMINOV</text>

  <text class="role" x="450" y="85" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4.5" fill="url(#role)">TECHNICAL PRODUCT MANAGER</text>

  <text class="models" x="450" y="107" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#5a5468">B2B  /  B2C  /  B2B2C  |  AVIATION  /  MEDTECH  /  EDTECH  /  E-COMMERCE</text>

  <line class="rule" x1="395" y1="127" x2="505" y2="127" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round"/>

  <g class="proof">
    <g stroke="#7f40ff" stroke-opacity="0.20" stroke-width="1">
      <line x1="250" y1="155" x2="250" y2="205"/>
      <line x1="450" y1="155" x2="450" y2="205"/>
      <line x1="650" y1="155" x2="650" y2="205"/>
    </g>

    <text x="150" y="179" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#5b21b6">3 000</text>
    <text x="150" y="199" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.8" fill="#5a5468">sales per month</text>

    <text x="350" y="179" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#5b21b6">6 months</text>
    <text x="350" y="199" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.8" fill="#5a5468">concept to launch</text>

    <text x="550" y="179" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#5b21b6">40%</text>
    <text x="550" y="199" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.8" fill="#5a5468">support handled by AI</text>

    <text x="750" y="179" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5" fill="#5b21b6">20+</text>
    <text x="750" y="199" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" letter-spacing="0.8" fill="#5a5468">people coordinated</text>
  </g>

  <rect class="bar" x="0" y="237" width="900" height="3" fill="url(#bar)" opacity="0.60"/>

  <rect x="0.5" y="0.5" width="899" height="239" rx="10" fill="none" stroke="#7f40ff" stroke-opacity="0.20"/>
</svg>
